# ~/.tmux.conf - Terminal multiplexer configuration

# Improve colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Increase scrollback buffer size
set -g history-limit 50000

# Start index from 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Enable mouse mode (scrolling, clicking panes/windows, resizing)
set -g mouse on

# Faster command sequences
set -s escape-time 10

# Split panes using | and - in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Reload tmux configuration with r
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# Status bar styling
set -g status-style bg=black,fg=white
set -g status-left-length 40
set -g status-left "#[fg=green][#S] "
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=yellow]%H:%M #[default]"
