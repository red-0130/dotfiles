# ==============================================================================
# Dotfiles Configuration
# ==============================================================================
# This configuration file defines default behaviors for the dotfiles installer.

# Predefined configs installed automatically when install.sh runs without flags
# (Standard behavior for GitHub Codespaces / Dev Containers / non-interactive setups)
PREDEFINED_CONFIGS=(
    "bash"
    "bash_scripts"
    "git"
    "superfile"
    "nvim"
    "zellij"
)

# Predefined applications to install if running a full setup
PREDEFINED_APPS=()

# Directory where backups of conflicting files will be stored
DOTFILES_BACKUP_DIR="${HOME}/.dotfiles_backup"

# Create symlinks (true) or copy files (false)
USE_SYMLINK=true

# Verbose logging (true/false)
VERBOSE=false
